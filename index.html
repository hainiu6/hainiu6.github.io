<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="海牛加速器地址发布页，收藏本页，随时查看最新地址。">
  <meta name="theme-color" content="#087f8c">
  <title>海牛加速器 · 地址发布页</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; color: #173844; background: radial-gradient(ellipse at 15% 0%, #dcf4ef 0%, transparent 55%), radial-gradient(ellipse at 100% 100%, #dcecfb 0%, transparent 55%), #f4f8fa; }
    main { width: 100%; max-width: 560px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .logo { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 15px; color: #fff; background: #087f8c; box-shadow: 0 8px 22px #087f8c24; }
    .card { overflow: hidden; padding: 42px 36px 34px; border: 1px solid #ffffff; border-radius: 28px; background: #ffffffed; box-shadow: 0 24px 70px #254c5c12; text-align: center; }
    .eyebrow { display: inline-block; padding: 7px 13px; border-radius: 100px; color: #087682; background: #eaf7f5; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
    h1 { margin: 22px 0 12px; font-size: clamp(23px, 5.8vw, 30px); line-height: 1.5; letter-spacing: -.5px; }
    .intro { margin: 0; color: #71838b; font-size: 14px; line-height: 1.9; }
    .address { margin: 30px 0 18px; padding: 19px 12px; border: 1px solid #e2edf0; border-radius: 14px; background: #f6fafb; }
    .address span { display: block; margin-bottom: 9px; color: #84949b; font-size: 12px; }
    .address a { color: #285661; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: clamp(14px, 4vw, 18px); text-decoration: none; overflow-wrap: anywhere; }
    .address a:hover { text-decoration: underline; }
    .visit { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 56px; padding: 15px 20px; border-radius: 14px; background: #087f8c; color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 22px #087f8c24; transition: background .18s, transform .18s; }
    .visit:hover { background: #066a75; transform: translateY(-1px); }
    a:focus-visible { outline: 3px solid #e5a942; outline-offset: 5px; }
    .hint { margin: 15px 0 0; color: #8a999f; font-size: 12px; line-height: 1.8; }
    .divider { height: 1px; margin: 28px 0 22px; background: #edf2f4; }
    .bookmark { margin: 0; color: #6e838b; font-size: 13px; line-height: 1.9; }
    footer { padding-top: 24px; text-align: center; color: #82969e; font-size: 12px; letter-spacing: 1px; }
    @media (max-width: 420px) { .card { padding: 32px 22px 28px; border-radius: 22px; } .brand { margin-bottom: 22px; } }
    @media (prefers-reduced-motion: reduce) { .visit { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="29" height="29" viewBox="0 0 32 32" fill="none"><path d="M5 15c3-4 5 4 9 0s6 4 10 0 4 0 4 0M5 22c3-4 5 4 9 0s6 4 10 0 4 0 4 0" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="22" cy="8" r="2.5" fill="currentColor"/></svg>
      </span>
      <span>海牛加速器</span>
    </div>
    <section class="card" aria-labelledby="page-title">
      <span class="eyebrow">地址发布页</span>
      <h1 id="page-title">海牛加速器最新地址</h1>
      <p class="intro">收藏这个页面，随时找到我们的最新入口。</p>
      <div class="address">
        <span>当前访问地址</span>
        <a href="http://103.118.41.189:200" target="_blank" rel="noopener noreferrer" aria-label="在新标签页访问 http://103.118.41.189:200">http://103.118.41.189:200</a>
      </div>
      <a class="visit" href="http://103.118.41.189:200" target="_blank" rel="noopener noreferrer">
        打开最新地址 <span aria-hidden="true">↗</span>
      </a>
      <p class="hint">点击后将在新标签页打开访问地址</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="bookmark">建议将本页加入浏览器书签<br>地址有更新时，回来查看即可</p>
    </section>
    <footer>海牛加速器 · 地址导航</footer>
  </main>
</body>
</html>
